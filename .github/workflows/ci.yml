name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GymBeamShiftsController.sln

      - name: Build
        run: dotnet build GymBeamShiftsController.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GymBeamShiftsController.sln --configuration Release --no-build --verbosity normal

      - name: Prepare deployment fixtures
        run: |
          mkdir -p instances/bot1/runtime-data instances/bot2/runtime-data
          cp deploy/examples/bot.env.example instances/bot1/.env
          cp deploy/examples/bot.env.example instances/bot2/.env
          cp deploy/examples/appconfig.example.json instances/bot1/appconfig.json
          cp deploy/examples/appconfig.example.json instances/bot2/appconfig.json

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build gymbeam-bot-1

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  deploy:
    name: Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/deploy.sh

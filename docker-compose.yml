services:
  gymbeam-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymbeam-shifts-bot
    restart: unless-stopped
    env_file:
      - ./GymBeamShiftsControllerX/.env
    environment:
      GYMBEAM_ADMIN_HOST: "*"
      GYMBEAM_ADMIN_PORT: "8080"
      CHROME_BIN: /usr/bin/chromium
      GYMBEAM_LOG_PATH: /app/runtime-data/app.log
    expose:
      - "8080"
    volumes:
      - ./GymBeamShiftsControllerX/appconfig.json:/app/appconfig.json
      - ./runtime-data:/app/runtime-data
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    container_name: gymbeam-nginx
    restart: unless-stopped
    depends_on:
      - gymbeam-bot
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
